<h1>Hi please enter your mood today</h1>

<form [formGroup]="options" (ngSubmit)="submit()">

  <label>Date</label>
  <input type="date" formControlName="date" class="date-input" />

  <div class="error" *ngIf="options.get('date')?.invalid && options.get('date')?.touched">
    Please choose a date
  </div>

  <div class="mood-options">
    <button
      type="button"
      *ngFor="let m of moods"
      class="mood-btn"
      [class.selected]="options.get('mood')?.value === m.value"
      (click)="selectMood(m.value)"
    >
      {{ m.label }}
    </button>

  </div>

  <div class="error" *ngIf="options.get('mood')?.invalid && options.get('mood')?.touched">
    Please choose a mood
  </div>

  <h2>Any details you wanna type ?</h2>

  <textarea formControlName="note" class="details-box"></textarea>

  <div class="error" *ngIf="options.get('note')?.invalid && options.get('note')?.touched">
    Details are too long (max 300 characters)
  </div>

  <button type="submit" class="save-btn" [disabled]="options.invalid">Save entry</button>
  
</form>
